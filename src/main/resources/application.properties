spring.application.name=act3
server.port=8084

# Base de datos MySQL. Las credenciales se leen de variables de entorno;
# si no existen, se usan los valores de prueba locales (después de los dos puntos).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/act3_t4?createDatabaseIfNotExist=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
