<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${tituloForm}">Alumno</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: encabezado}"></header>
<nav th:replace="~{fragments/layout :: menu}"></nav>
<main>
    <div class="card">
        <h2 th:text="${tituloForm}">Alumno</h2>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{${accion}}" th:object="${alumno}" method="post">
            <label for="matricula">Matrícula</label>
            <input id="matricula" type="text" th:field="*{matricula}" required maxlength="20">

            <label for="nombre">Nombre completo</label>
            <input id="nombre" type="text" th:field="*{nombre}" required maxlength="100">

            <label for="email">Correo</label>
            <input id="email" type="email" th:field="*{email}" maxlength="100">

            <label for="semestre">Semestre</label>
            <input id="semestre" type="number" min="1" max="14" th:field="*{semestre}" required>

            <!-- La relación se elige con un select de carreras (se guarda su id como llave foránea) -->
            <label for="carreraId">Carrera</label>
            <select id="carreraId" th:field="*{carreraId}" required>
                <option value="">Selecciona una carrera</option>
                <option th:each="c : ${carreras}" th:value="${c.id}" th:text="${c.clave + ' - ' + c.nombre}"></option>
            </select>

            <p class="acciones" style="margin-top:16px">
                <button type="submit">Guardar</button>
                <a class="boton sec" th:href="@{/alumnos}">Cancelar</a>
            </p>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
